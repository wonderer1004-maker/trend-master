name: Backtest smoke tests
on:
  push:
    paths:
      - 'pages/1_신고가_4전략.py'
      - 'tests/test_breakout_four.py'
      - '.github/workflows/backtest-test.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: pip install 'numpy>=1.26' 'pandas>=2.2'
      - name: Compile Streamlit page
        run: python -m py_compile 'pages/1_신고가_4전략.py'
      - name: Run synthetic four-strategy tests
        run: python -m unittest discover -s tests -p 'test_breakout_four.py' -v
