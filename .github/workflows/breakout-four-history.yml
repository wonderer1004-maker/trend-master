name: Real historical breakout backtest
on:
  workflow_dispatch:
  schedule:
    - cron: '15 1 * * 1'
jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pykrx
      - name: Run actual historical data check
        run: python scripts/run_breakout_four_history.py
      - name: Upload report CSVs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: breakout-four-historical-report
          path: reports/breakout_four/
          retention-days: 30
