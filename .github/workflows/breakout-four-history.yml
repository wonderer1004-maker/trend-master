name: Real historical breakout backtest
on:
  push:
    paths:
      - 'scripts/run_breakout_four_history.py'
      - 'pages/1_신고가_4전략.py'
      - '.github/workflows/breakout-four-history.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 1 * * 1'
jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pykrx
      - name: Run actual historical data check
        shell: bash
        run: |
          mkdir -p reports/breakout_four
          set -o pipefail
          python -u scripts/run_breakout_four_history.py 2>&1 | tee reports/breakout_four/execution.log
      - name: Upload report CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breakout-four-historical-report-and-debug
          path: reports/breakout_four/
          retention-days: 30

# Manual backtest start requested on 2026-10-12; push triggers historical job.
