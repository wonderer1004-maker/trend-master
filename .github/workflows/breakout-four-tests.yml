name: Breakout four strategy tests
on:
  push:
    paths:
      - 'pages/1_신고가_4전략.py'
      - 'tests/test_breakout_four.py'
      - '.github/workflows/breakout-four-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas
      - run: python -m unittest discover -s tests -p 'test_breakout_four.py' -v
