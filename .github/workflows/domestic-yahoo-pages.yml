name: Domestic ETF Yahoo alerts
on:
  push:
    branches: [main]
    paths: ['docs/**', 'domestic_alerts/**', '.github/workflows/domestic-yahoo-pages.yml']
  workflow_dispatch:
  schedule:
    - cron: '20 7,8 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: domestic-yahoo-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r domestic_alerts/requirements.txt
      - name: Refresh completed Yahoo bars
        run: python domestic_alerts/publish_data.py
      - name: Verify browser strategy
        run: node domestic_alerts/test_logic.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
