name: Trend Refined V8 small risk return upgrade
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/trend_refined_v8.py
      - scripts/export_v8_alert_feed.py
      - tests/test_v8_alert_feed.py
      - tests/test_trend_refined_v8.py
      - .github/workflows/trend-refined-v8.yml
  schedule:
    - cron: '25 8 * * 1-5'
permissions:
  contents: write
concurrency:
  group: trend-refined-v8
  cancel-in-progress: false
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==2.2.6 yfinance==0.2.65
      - name: Execution and duplicate intent tests
        run: python -m unittest discover -s tests -p 'test_trend_*v*.py' -v
      - name: Alert feed correctness
        run: python -m unittest discover -s tests -p test_v8_alert_feed.py -v
      - name: Historical comparisons and cost stress
        run: python -u scripts/trend_refined_v8.py --data-dir reports/trend_fast_v7/input
      - name: Latest close screen and paper intents
        run: python -u scripts/trend_refined_v8.py --end "$(date -u -d tomorrow +%Y-%m-%d)" --output reports/trend_refined_v8_latest --paper-model DUAL_BAND45
      - name: Export verified V8 web and Kakao signal feed
        run: python scripts/export_v8_alert_feed.py
      - name: Publish results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          report_staging=$(mktemp -d)
          cp -a reports/trend_refined_v8 reports/trend_refined_v8_latest "$report_staging/"
          published=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports/trend_refined_v8 reports/trend_refined_v8_latest
            cp -a "$report_staging/trend_refined_v8/." reports/trend_refined_v8/
            cp -a "$report_staging/trend_refined_v8_latest/." reports/trend_refined_v8_latest/
            git add -f reports/trend_refined_v8 reports/trend_refined_v8_latest
            if git diff --cached --quiet; then
              published=1
              break
            fi
            git commit -m 'Publish V8 refined validation and paper automation'
            if git push origin HEAD:main; then
              published=1
              break
            fi
          done
          test "$published" = 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trend-refined-v8-results
          path: reports/trend_refined_v8*/
